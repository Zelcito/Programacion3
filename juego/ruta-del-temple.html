.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;outline:none;touch-action:manipulation}
canvas:focus-visible{box-shadow:0 0 0 2px #E0B44C}

/* ============ Ordenamientos propios (divide y vencerás) ============ */
function mergeSort(a, cmp){
  if(a.length <= 1) return a.slice();
  const m = a.length >> 1, L = mergeSort(a.slice(0,m), cmp), Rr = mergeSort(a.slice(m), cmp), out = [];
  let i = 0, j = 0;
  while(i < L.length && j < Rr.length) out.push(cmp(L[i], Rr[j]) <= 0 ? L[i++] : Rr[j++]);
  while(i < L.length) out.push(L[i++]); while(j < Rr.length) out.push(Rr[j++]);
  return out;
}
function quickSort(a, cmp){
  const b = a.slice();
  (function qs(lo, hi){ if(lo >= hi) return;
    const pi = lo + Math.floor(Math.random()*(hi-lo+1)); [b[pi],b[hi]] = [b[hi],b[pi]];
    let s = lo; for(let i = lo; i < hi; i++) if(cmp(b[i], b[hi]) < 0){ [b[i],b[s]] = [b[s],b[i]]; s++; }
    [b[s],b[hi]] = [b[hi],b[s]]; qs(lo, s-1); qs(s+1, hi); })(0, b.length-1);
  return b;
}

/* ============ Mochila: greedy vs programación dinámica ============ */
function knapGreedy(items, cap){
  const order = mergeSort(items.map((_,i) => i), (a,b) => items[b].v/items[b].p - items[a].v/items[a].p);
  const sel = new Set(); let c = cap, val = 0;
  order.forEach(i => { if(items[i].p <= c){ sel.add(i); c -= items[i].p; val += items[i].v; } });
  return {sel, val, order};
}
function knapDP(items, cap){
  const n = items.length, T = [];
  for(let i = 0; i <= n; i++) T.push(new Array(cap+1).fill(0));
  for(let i = 1; i <= n; i++){ const {p, v} = items[i-1];
    for(let c = 0; c <= cap; c++){ T[i][c] = T[i-1][c]; if(p <= c && T[i-1][c-p] + v > T[i][c]) T[i][c] = T[i-1][c-p] + v; } }
  const sel = new Set(), cells = []; let c = cap;
  for(let i = n; i > 0; i--){ cells.push([i,c]); if(T[i][c] !== T[i-1][c]){ sel.add(i-1); c -= items[i-1].p; } }
  cells.push([0,c]);

/* ============ Estructuras para grafos ============ */
class MinHeap{
  constructor(){ this.a = []; }
  get size(){ return this.a.length; }
  push(x){ const a = this.a; a.push(x); let i = a.length-1;
    while(i > 0){ const p = (i-1) >> 1; if(a[p][0] <= a[i][0]) break; [a[p],a[i]] = [a[i],a[p]]; i = p; } }
  pop(){ const a = this.a, top = a[0], last = a.pop();
    if(a.length){ a[0] = last; let i = 0;
      for(;;){ const l = 2*i+1, r = l+1; let m = i;
        if(l < a.length && a[l][0] < a[m][0]) m = l;
        if(r < a.length && a[r][0] < a[m][0]) m = r;
        if(m === i) break; [a[m],a[i]] = [a[i],a[m]]; i = m; } }
    return top; }
}
class UnionFind{
  constructor(n){ this.p = [...Array(n).keys()]; this.r = new Array(n).fill(0); }
  find(x){ while(this.p[x] !== x){ this.p[x] = this.p[this.p[x]]; x = this.p[x]; } return x; }
  union(a,b){ a = this.find(a); b = this.find(b); if(a === b) return false;
    if(this.r[a] < this.r[b]) [a,b] = [b,a]; this.p[b] = a; if(this.r[a] === this.r[b]) this.r[a]++; return true; }
}

const SEASONS = [
  {n:"Primavera", c:"#6EA03A", d:"los caminos están tranquilos"},
  {n:"Verano", c:"#C08A1A", mar:-1, d:"buen viento: el mar cuesta 1 jornada menos"},
  {n:"Otoño", c:"#C0601A", mar:2, d:"tormentas: el mar cuesta 2 jornadas más"},
  {n:"Invierno", c:"#4A7AA8", mont:2, d:"nieve: la montaña cuesta 2 jornadas más"}
];
const SEASON_LEN = 8;
let S = null;
function recompute(){
  const se = SEASONS[S.season];
  G.edges.forEach(e => { let m = e.evt;
    if(e.terr === "mar") m += se.mar || 0; if(e.terr === "montana") m += se.mont || 0; if(S.calz.has(e.i)) m -= 1;
    e.w = Math.max(1, e.base + m); });
  G.adj = G.adjAll.map(l => l.filter(o => !o.e.blocked));
}
function see(u){ S.knownN.add(u); G.adjAll[u].forEach(({v,e}) => { S.knownN.add(v); S.knownE.add(e.i); }); }
function revealPath(p){ if(!p) return; p.forEach((u,i) => { S.knownN.add(u); if(i) S.knownE.add(G.ek[p[i-1]+"|"+u].i); }); }
function revealEdges(list){ list.forEach(ei => { const e = G.edges[ei]; S.knownE.add(ei); S.knownN.add(e.a); S.knownN.add(e.b); }); }
function keepsConnected(x){
  const seen = new Set([G.goal]), q = [G.goal];
  while(q.length){ const u = q.pop(); for(const {v,e} of G.adjAll[u]) if(!e.blocked && e !== x && !seen.has(v)){ seen.add(v); q.push(v); } }
  return seen.size === G.nodes.length;
}
function mapEvent(){
  const cand = [...S.knownE].map(i => G.edges[i]).filter(e => !e.blocked && !e.evtDone);
  if(!cand.length) return;
  const e = pick(cand), A = G.nodes[e.a].name, B = G.nodes[e.b].name, r = Math.random(); e.evtDone = true;
  if(r < .35){ e.evt += 3; news(`Cayó el puente entre ${A} y ${B}: ese tramo cuesta 3 jornadas más.`, "stone", C.red); }
  else if(r < .65 && keepsConnected(e)){ e.blocked = true; news(`Un ejército corta el paso entre ${A} y ${B}: camino bloqueado.`, "escudo", C.red); }
  else { e.evt -= 2; news(`Unos pastores te muestran un atajo entre ${A} y ${B}: 2 jornadas menos.`, "olive", C.bfs); }
}
function stuck(){ return S.cur !== G.goal && !G.adj[S.cur].some(o => o.e.w <= S.viv); }
function backToMap(){
  if(!S.over && stuck()) S.over = "lose";
  if(!S.over && S.bragado === "pend"){ S.bragado = "visto"; go("bragado"); return; }
  go(S.over ? "fin" : "mapa");
}
// revela la niebla hasta cierta distancia (en tramos) alrededor de una ciudad
function revealAround(u, depth){ const lvl = {[u]:0}, q = [u];
  while(q.length){ const a = q.shift(); if(lvl[a] < depth){ see(a); G.adjAll[a].forEach(({v}) => { if(!(v in lvl)){ lvl[v] = lvl[a] + 1; q.push(v); } }); } } }

const MOCHILA = (function(){
  let order = [], sortMode = 0, msg = "", hint = false;

    if(P().mode === "mercado") banner(P().title, "La comida que comiste liberó lugar en la mochila", "tent"); }
  function toggle(i){
    const it = P().items[i];
    if(P().sel.has(i)){ P().sel.delete(i); beep([294],.05); return; }
    if(peso() + it.p > P().cap){ msg = `${it.n} pesa ${it.p} kg y te quedan ${P().cap - peso()} kg libres.`; beep([140,100],.09,"sawtooth",.04); return; }

    else if(sortMode === 1){ order = mergeSort(idx, (a,b) => it[b].v/it[b].p - it[a].v/it[a].p); msg = "MergeSort: divide la lista a la mitad, ordena cada mitad y las intercala. O(n log n)."; }
    else { order = quickSort(idx, (a,b) => it[a].p - it[b].p); msg = "QuickSort: elige un pivote y parte en menores y mayores. O(n log n) promedio."; }

/* ============ Escena: REPARTO DE ESCOLTAS (Branch & Bound) ============ */
const REPARTO = (function(){
  const KN = ["Hugo de Payens", "Godofredo", "Andrés de Montbard", "Payen", "Archambaud"];

  function enter(){
    city = G.nodes[S.cur].name; asg = new Array(5).fill(-1); res = null;
    // matriz fija y documentable: el greedy por filas da 31, el óptimo es 25
    M = REPARTO_M.map(r => r.slice());
    banner("Encomienda de " + city, "Carta entregada · el comendador necesita tu ayuda", "letter");
  }
  const total = () => asg.every(c => c >= 0) ? sum(asg.map((c,r) => M[r][c]), x => x) : null;

  function leave(){

    S.viv += res.bonus; S.bbDone = true; rewardHorse(res.stars, "El comendador");
    S.bb = {you:res.you, opt:res.best, explored:res.explored, pruned:res.pruned, brute:res.brute};

        const hov = !res && over(x, y, cw-4, chh-4);
        frame(x, y, cw-4, chh-4, mine ? C.gold : hov ? "#C9A86A" : "#5A4024", mine ? "#6A4A18" : "#2A1C12");

    ctx.drawImage(ic, x + 38 - ic.width*sc/2, y + 52 - ic.height*sc/2, ic.width*sc, ic.height*sc);
    const th = para(E.text(T), x+76, y+24, w-86, C.parch, 13, 12);
    if(T.result){
      para(T.result[0], x+76, y+30 + th, w-86, T.result[2] === C.red ? "#F08A7A" : T.result[2] === C.ink2 ? C.muted : C.green, 14, 13);
      btn(x + w/2 - 90, y+h-26, 180, 20, "Seguir viaje (Enter)", () => choose(0), {red:true, sz:14});
    } else {
      E.opts.forEach((o, i) => btn(x + 10 + i*(w/2 - 5), y+h-26, w/2 - 15, 20, `${i+1}. ${o.l}`, () => choose(i), {red:i === 0, disabled:o.ok && !o.ok(), sz:13}));
    }
  }
  return {
    begin, draw, noEsc:() => true,
    enter(){ T.last = 0;
      BANNERS.length = 0; const now = performance.now();
      TOASTS.forEach(q => { q.dur = q.t0 === null ? 0 : Math.min(q.dur, now - q.t0 + 500); }); },
    key(k){
      if(T.phase === "dialog"){
        const E = EVENTS[T.ev];
        if(k === "1") choose(0); else if(k === "2" || k === "r") choose(1);
        else if(k === "enter"){ if(T.ev === "templar") choose(S.inv.length < 4 ? 0 : 1); else if(T.result) choose(0);
          else { const i = E.opts.findIndex(o => !o.ok || o.ok()); choose(i < 0 ? 0 : i); } }
      }
      else if(k === " ") T.camZ = Math.min(T.ev && !T.aside ? T.eventZ - 3 : T.L, T.camZ + 600); },
    click(){}, move(){}
  };
})();

/* ============ Easter egg: la Fiesta del Caballo de Bragado (un sueño en Constantinopla) ============ */
const BRAGADO = (function(){
  const HZ = 196;   // horizonte bajo: la pampa es casi todo cielo
  let t0 = 0, riders = [], smoke = [], clouds = [], crowd = [];
  function enter(){
    t0 = performance.now(); smoke = [];
    riders = [{sp:SP.gaucho1, x:-40, y:262, s:2.4, v:.055}, {sp:SP.gaucho2, x:-260, y:236, s:1.8, v:.04}, {sp:SP.gaucho3, x:-520, y:216, s:1.2, v:.028}];
    clouds = [...Array(7)].map((_, i) => ({x:i*110 + Math.random()*60, y:30 + Math.random()*70, w:60 + Math.random()*90, v:.004 + Math.random()*.006}));
    crowd = [...Array(26)].map(() => ({x:200 + Math.random()*250, y:226 + Math.random()*10, c:pick(["#B03A2A", "#2A4A7A", "#E8E2D0", "#6A4A2A", "#74ACDF", "#3A6A3A"]), h:6 + Math.random()*3, ph:Math.random()*6}));
    beep([392, 494, 587, 784], .14, "triangle", .05);
  }
  function leave(){
    S.horse = {age:4, criollo:true};
    news("Despertás en Constantinopla. En el establo te espera un caballo criollo: no se lastima ni se cansa.", "horseIcon", C.gold);
    banner("Un caballo criollo", "Regalo de la Fiesta Nacional del Caballo · Bragado", "horseIcon");
    go("mapa");
  }
  function cloud(x, y, w){
    ctx.fillStyle = "rgba(255,255,255,.95)";
    for(let i = 0; i < 6; i++){ const px = x + (i/5)*w, r = w*(.16 + .08*Math.sin(i*1.7 + w)); ctx.beginPath(); ctx.ellipse(px, y - r*.4, r, r*.8, 0, 0, 6.283); ctx.fill(); }
    ctx.fillRect(x, y - 2, w, 4); ctx.fillStyle = "rgba(120,150,190,.18)"; ctx.fillRect(x - w*.05, y + 1, w*1.1, 2);
  }
  function draw(t){
    const a = t - t0;
    // cielo de la pampa
    const sg = ctx.createLinearGradient(0, 0, 0, HZ); sg.addColorStop(0, "#2E78C4"); sg.addColorStop(.6, "#7EB8E6"); sg.addColorStop(1, "#DCEEF6");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, VW, HZ + 1);
    const gl = ctx.createRadialGradient(540, 58, 8, 540, 58, 110); gl.addColorStop(0, "rgba(255,248,220,.75)"); gl.addColorStop(1, "rgba(255,248,220,0)");
    ctx.fillStyle = gl; ctx.fillRect(430, 0, 210, 170); ctx.fillStyle = "#FFF6D8"; ctx.beginPath(); ctx.arc(540, 58, 14, 0, 6.283); ctx.fill();
    clouds.forEach(c => cloud(((c.x + t*c.v) % (VW + 200)) - 100, c.y, c.w));
    // montes lejanos sobre el horizonte
    ctx.fillStyle = "#4E7A3A"; for(let x = 0; x < VW; x += 7){ const h = 3 + Math.abs(Math.sin(x*.13))*5; if(Math.sin(x*.031) > -.2){ ctx.beginPath(); ctx.arc(x, HZ - h*.5, h, Math.PI, 0); ctx.fill(); } }
    // la llanura
    for(let py = HZ; py < VH; py += .5){ const dy = py - HZ + .5, z = 9000/dy, alt = Math.floor((z + t*.02)/60) % 2;
      ctx.fillStyle = alt ? "#7EA84A" : "#76A044"; ctx.fillRect(0, py, VW, .5); }
    const hz = ctx.createLinearGradient(0, HZ - 8, 0, HZ + 30); hz.addColorStop(0, "rgba(220,238,246,0)"); hz.addColorStop(.3, "rgba(220,238,246,.6)"); hz.addColorStop(1, "rgba(220,238,246,0)");
    ctx.fillStyle = hz; ctx.fillRect(0, HZ - 8, VW, 38);
    // alambrado que se pierde en el horizonte
    ctx.strokeStyle = "rgba(60,50,40,.7)"; ctx.lineWidth = .7;
    for(let k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(0, 312 - k*9); ctx.lineTo(300, HZ + 2 - k*1.2); ctx.stroke(); }
    for(let i = 0; i < 12; i++){ const p = Math.pow(i/12, 1.6), x = p*300, y = 312 + (HZ + 2 - 312)*p, h = 34*(1 - p) + 3;
      ctx.fillStyle = "#5A4028"; ctx.fillRect(x - 1.5*(1 - p) - .5, y - h, 3*(1 - p) + 1, h); }
    // el ombú
    ctx.fillStyle = "#4A3424"; ctx.beginPath(); ctx.moveTo(70, 300); ctx.quadraticCurveTo(84, 250, 76, 210); ctx.lineTo(96, 210); ctx.quadraticCurveTo(92, 256, 112, 300); ctx.fill();
    [[86, 186, 46], [56, 200, 32], [118, 198, 34], [88, 160, 34], [64, 172, 26], [112, 170, 28]].forEach(([x, y, r], i) => {
      ctx.fillStyle = i % 2 ? "#2E5A26" : "#3A6A2E"; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); });
    ctx.fillStyle = "rgba(255,255,220,.12)"; ctx.beginPath(); ctx.arc(98, 168, 26, 0, 6.283); ctx.fill();
    // arco con el cartel de la fiesta
    ctx.fillStyle = "#5A3A1E"; ctx.fillRect(196, 118, 5, 112); ctx.fillRect(452, 118, 5, 112);
    const bw = 262, bx = 196, by = 124, wave = reduced ? 0 : Math.sin(t/400)*1.5;
    ctx.fillStyle = "#74ACDF"; ctx.fillRect(bx + 5, by + wave, bw - 5, 11); ctx.fillStyle = "#FFFFFF"; ctx.fillRect(bx + 5, by + 11 + wave, bw - 5, 22); ctx.fillStyle = "#74ACDF"; ctx.fillRect(bx + 5, by + 33 + wave, bw - 5, 11);
    ctx.fillStyle = "#F6B40E"; ctx.beginPath(); ctx.arc(bx + 22, by + 22 + wave, 7, 0, 6.283); ctx.fill(); ctx.beginPath(); ctx.arc(bx + bw - 17, by + 22 + wave, 7, 0, 6.283); ctx.fill();
    txFit("FIESTA NACIONAL DEL CABALLO", bx + bw/2 + 2, by + 13 + wave, 190, "#2A3A6A", 16, {f:FT, al:"center"});
    tx("Bragado", bx + bw/2 + 2, by + 1 + wave, "#FFFFFF", 11, {f:FT, al:"center"});
    // la gente mirando
    crowd.forEach(c => { const j = reduced ? 0 : Math.max(0, Math.sin(t/180 + c.ph))*1.5; ctx.fillStyle = c.c; ctx.fillRect(c.x, c.y - c.h - j, 3, c.h); ctx.fillStyle = "#C08A60"; ctx.fillRect(c.x + .5, c.y - c.h - 2.5 - j, 2, 2.5); });
    // asado con humo
    ctx.fillStyle = "#3A2A1E"; ctx.fillRect(536, 286, 34, 3); ctx.fillStyle = "#E06A1A"; ctx.fillRect(540, 289, 26, 4); ctx.fillStyle = "#F6B40E"; ctx.fillRect(546, 288, 12, 2);
    if(!reduced && Math.random() < .5) smoke.push({x:550 + Math.random()*14, y:284, vx:.1 + Math.random()*.2, r:3, life:120});
    smoke = smoke.filter(q => (q.life-- > 0));
    smoke.forEach(q => { q.x += q.vx; q.y -= .35; q.r += .05; ctx.fillStyle = `rgba(230,230,230,${q.life/240})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill(); });
    // la doma: un caballo que corcovea en el centro
    const buck = reduced ? 0 : Math.sin(t/260)*.35, jump = reduced ? 0 : Math.abs(Math.sin(t/260))*10;
    ctx.save(); ctx.translate(332, 270 - jump); ctx.rotate(-Math.abs(buck)); const dw = SP.gaucho1.width*2.2, dh = SP.gaucho1.height*2.2;
    ctx.drawImage(SP.gaucho1, -dw*.15, -dh, dw, dh); ctx.restore();
    ctx.fillStyle = "rgba(30,40,20,.25)"; ctx.beginPath(); ctx.ellipse(345, 272, 26, 4, 0, 0, 6.283); ctx.fill();
    // jinetes cruzando la pampa
    riders.forEach(r => { r.x += r.v*16; if(r.x > VW + 60) r.x = -80; const w = r.sp.width*r.s, h = r.sp.height*r.s, gal = reduced ? 0 : Math.abs(Math.sin(t/120 + r.y))*2*r.s/2;
      ctx.fillStyle = "rgba(30,40,20,.25)"; ctx.beginPath(); ctx.ellipse(r.x + w/2, r.y, w*.4, 2*r.s/2, 0, 0, 6.283); ctx.fill();
      ctx.drawImage(r.sp, r.x, r.y - h - gal, w, h); });
    // velo de sueño
    const vg = ctx.createRadialGradient(VW/2, VH/2, 150, VW/2, VH/2, 400); vg.addColorStop(0, "rgba(255,255,255,0)"); vg.addColorStop(1, "rgba(255,250,235,.75)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    if(a < 1600){ ctx.fillStyle = `rgba(255,250,235,${1 - a/1600})`; ctx.fillRect(0, 0, VW, VH); }
    // relato
    ctx.globalAlpha = clamp((a - 600)/800, 0, 1);
    tx("Un sueño en Constantinopla", VW/2, 30, "#2A3A6A", 26, {f:FT, al:"center", sh:"rgba(255,255,255,.8)"});
    para("Esa noche, en la posada, soñás con una llanura infinita al otro lado de un mar que nadie conoce. Hay gauchos, caballos criollos y una fiesta que todavía no existe.",
      150, 62, 340, "#1E2A4A", 13, 13, {sh:"rgba(255,255,255,.7)"});
    ctx.globalAlpha = 1;
    if(a > 2200){ panel(170, 304, 300, 50, "", "#74ACDF");
      txFit("Al despertar, alguien te dejó un regalo en el establo…", 320, 312, 280, C.parch, 13, {al:"center"});
      btn(220, 328, 200, 20, "Despertar en Constantinopla (Enter)", leave, {red:true, sz:13}); }
  }
  return {enter, draw, noEsc:() => true, key(k){ if(k === "enter" && performance.now() - t0 > 1200) leave(); }, click(){}, move(){}};
})();

/* ============ Escena: FIN ============ */
const FIN = (function(){
  function enter(){ BANNERS.length = 0; TOASTS.length = 0; beep(S.over === "win" ? [523,659,784,1047] : [392,330,262,196], .12, "square", .05); }
  function draw(t){
    R(0, 0, VW, VH, "#140D08");
    if(PARCH){ ctx.globalAlpha = .22; ctx.drawImage(PARCH, 0, 0, VW, VH); ctx.globalAlpha = 1; }
    const win = S.over === "win", L = S.letters.size;
    const st = !win ? 0 : L < 3 ? 1 : S.used <= G.optMission ? 3 : S.used <= G.optMission*1.2 ? 2 : 1;
    panel(50, 8, 540, 324, win ? "Deus vult" : "Peregrinación fallida", win ? C.gold : C.red);
    tx(win ? (L === 3 ? "Misión cumplida" : "Llegaste a Jerusalén") : "No llegaste", VW/2, 28, win ? C.gold : C.red, 36, {f:FT, al:"center", sh:"#000000"});
    if(win) stars(st, VW/2, 66, 22);
    else para(S.viv < 0 ? "Te quedaste sin víveres en el camino." : `En ${G.nodes[S.cur].name} ya no te alcanzan los víveres para ningún tramo.`, 70, 78, 500, C.parch, 14);
    let y = 96;
    const line = (a, b, c) => { txFit(a, 70, y, 142, C.muted, 13); y += para(b, 220, y, 350, c || C.parchL, 13, 12) + 4; };
    line("Tu ruta", `${S.used} jornadas, ${S.trail.length} tramos, ${L}/3 cartas entregadas`);
    const ord = [G.start, ...G.missionOrder, G.goal].map(i => G.nodes[i].name).join(" → ");
    line("Misión óptima", `${G.optMission} jornadas (Floyd-Warshall + los 6 órdenes posibles): ${ord}`, C.blue);
    line("Solo ir a Jerusalén", `${G.opt} jornadas con Dijkstra`, C.blue);
    S.packs.forEach(p => line(p.title, `vos ${p.you} · greedy ${p.greedy} · PD ${p.dp}`, C.gold));
    if(S.bb) line("Reparto B&B", `vos ${S.bb.you === null ? "–" : S.bb.you} · óptimo ${S.bb.opt} · exploró ${S.bb.explored} de ${S.bb.brute} nodos`, C.gold);
    line("Caballo", horseLabel(S.horse) + (S.bragado === "visto" ? " · visitaste la Fiesta del Caballo" : ""));
    line("Objetos usados", S.log.length ? S.log.join(", ") : "ninguno");
    y = Math.min(y, 282);
    if(win) para(L < 3 ? "Jerusalén te recibe, pero faltaron cartas: máximo una estrella." :
                 S.used < G.optMission ? "Le ganaste a la misión óptima: los atajos, calzadas o estaciones jugaron a tu favor." :
                 S.used === G.optMission ? "Empataste la misión óptima del mapa original." : `La misión óptima usaba ${S.used - G.optMission} jornadas menos.`, 70, y + 4, 500, "#F0C47A", 14);
    btn(VW/2 - 180, 302, 170, 24, "Ver mapa", () => go("mapa"), {sz:15});
    btn(VW/2 + 10, 302, 170, 24, "Nueva peregrinación (Enter)", newGame, {red:true, sz:15});
    tx("El Mediterráneo de 1129 con sus rutas reales · la ciudad de partida cambia en cada peregrinación.", VW/2, 340, C.muted, 13, {al:"center"});
  }
  return {enter, draw, key(k){ if(k === "enter") newGame(); }, click(){}, move(){}};
})();

/* ============ Motor de escenas ============ */
const SCENES = {title:TITLE, mochila:MOCHILA, veredicto:VEREDICTO, reparto:REPARTO, mapa:MAPA, viaje:VIAJE, bragado:BRAGADO, fin:FIN};
let scene = TITLE, fadeT0 = -1e9;
function go(name){ const s = SCENES[name]; if(!s) return; if(name !== "mapa") parts.length = 0; scene = s; if(s.enter) s.enter(); fadeT0 = performance.now(); beep([392,523],.05); }
function loop(t){
  UI = []; pointer = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.imageSmoothingEnabled = false;
  if(scene.move && mouse.x >= 0) scene.move(mouse.x, mouse.y);
  scene.draw(t);
  drawOverlays(t);
  const f = (t - fadeT0)/300; if(f < 1 && !reduced){ ctx.fillStyle = `rgba(0,0,0,${1-f})`; ctx.fillRect(0, 0, VW, VH); }
  cv.style.cursor = pointer ? "pointer" : "default";
  requestAnimationFrame(loop);
}
function toLogical(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*VW/r.width, (e.clientY - r.top)*VH/r.height]; }
cv.addEventListener("mousemove", e => { const [x,y] = toLogical(e);
  if(mouse.down && scene.drag && mouse.x >= 0){ mouse.dragDist += Math.hypot(x - mouse.x, y - mouse.y); if(mouse.dragDist > 4) scene.drag(x - mouse.x, y - mouse.y); }
  mouse.x = x; mouse.y = y; });
cv.addEventListener("mousedown", e => { if(e.button === 0){ mouse.down = true; mouse.dragDist = 0; } });
addEventListener("mouseup", () => { mouse.down = false; });
cv.addEventListener("wheel", e => { if(!scene.wheel) return; e.preventDefault(); const [x,y] = toLogical(e); scene.wheel(x, y, e.deltaY); }, {passive:false});
cv.addEventListener("mouseleave", () => { mouse.x = mouse.y = -1; });
cv.addEventListener("click", e => { cv.focus(); const [x,y] = toLogical(e); mouse.x = x; mouse.y = y; if(mouse.dragDist > 4){ mouse.dragDist = 0; return; }
  for(let i = UI.length-1; i >= 0; i--){ const u = UI[i]; if(x >= u.x && x < u.x+u.w && y >= u.y && y < u.y+u.h){ if(!u.disabled) u.fn(); return; } }
  scene.click(x, y); });
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if(k === "escape"){ if(scene.esc && scene.esc()) return; if(scene !== TITLE && !(scene.noEsc && scene.noEsc())) go("title"); return; }
  if(k === "m"){ toggleSound(); return; }
  if(k === "f"){ toggleFullscreen(); return; }
  scene.key(k);
});
// ocupa toda la ventana que permita el 16:9, centrado (las franjas sobrantes quedan negras)
function fit(){ const s = Math.min(innerWidth/VW, innerHeight/VH);
  cv.style.width = Math.floor(VW*s) + "px"; cv.style.height = Math.floor(VH*s) + "px"; }
function toggleFullscreen(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} }
addEventListener("resize", fit);
document.addEventListener("fullscreenchange", fit);
fit();
// gancho de depuración: dibuja un cuadro con el tiempo dado (para pruebas automáticas)
const tick = t => { UI = []; pointer = false; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); scene.draw(t); drawOverlays(t); return scene; };
window.__temple = {get S(){ return S; }, get G(){ return G; }, get scene(){ return Object.keys(SCENES).find(k => SCENES[k] === scene); }, go, newGame, bbAssign, toast, banner, tick};
requestAnimationFrame(loop);
})();
</script>
