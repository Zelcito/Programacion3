spring.application.name=tpo-prog3

# Carga .env (gitignoreado) como fuente de propiedades. Las variables de entorno
# reales, si existen, tienen prioridad sobre el archivo.
spring.config.import=optional:file:.env[.properties]

# --- Conexion a Neo4j -------------------------------------------------------
# NUNCA escribir la password aca: va en .env (ver .env.example).
# Local:  NEO4J_URI=neo4j://127.0.0.1:7687
# Aura:   NEO4J_URI=neo4j+s://xxxxxxx.databases.neo4j.io
spring.neo4j.uri=${NEO4J_URI:neo4j://127.0.0.1:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# --- Carga de datos de ejemplo ---------------------------------------------
# Poner en false cuando el grupo cargue su propio dominio.
app.seed.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.uade.prog3.tpo=INFO
